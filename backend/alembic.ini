[alembic]
script_location = /home/user/eepy-host/backend/alembic
sqlalchemy.url = postgresql://eepy_admin:[ROTATED_POSTGRES_PASSWORD]@db:5432/eepy_host

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = 
formatter = generic

[logger_alembic]
level = INFO
handlers = 
formatter = generic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

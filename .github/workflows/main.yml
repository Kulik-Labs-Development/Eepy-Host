name: Build and Push to GHCR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository (with integration submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push HappyFox MCP sidecar image
        # Built from the integrations/happyfox-mcp submodule so the deployed
        # sidecar always matches the exact upstream commit this repo pins.
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./integrations/Dockerfile.happyfox
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-happyfox:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push eBay MCP sidecar image
        # Built from the integrations/ebay-mcp submodule so the deployed
        # sidecar always matches the exact upstream commit this repo pins.
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./integrations/Dockerfile.ebay
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ebay:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Portainer MCP sidecar image
        # Built from the integrations/portainer-mcp submodule so the deployed
        # sidecar always matches the exact upstream commit this repo pins.
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./integrations/Dockerfile.portainer
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-portainer:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Warden MCP sidecar image
        # Built from the integrations/warden-mcp submodule so the deployed
        # sidecar always matches the exact upstream commit this repo pins.
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./integrations/Dockerfile.warden
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-warden:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Proxmox MCP sidecar image
        # Built from the integrations/proxmox-mcp submodule (upstream
        # RekklesNA/ProxmoxMCP-Plus) so the deployed sidecar always matches
        # the exact upstream commit this repo pins.
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./integrations/Dockerfile.proxmox
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-proxmox:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Tactical RMM MCP sidecar image
        # Built from the integrations/trmm-mcp submodule (upstream
        # shin2344234/trmm-mcp) so the deployed sidecar always matches the
        # exact upstream commit this repo pins. One image serves BOTH Eepy
        # templates (trmm read-only and trmm-exec read+command) — the mode
        # is a per-template static env in the seed.
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./integrations/Dockerfile.trmm
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-trmm:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          labels: ${{ steps.meta.outputs.labels }}

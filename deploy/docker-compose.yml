# Secrets are supplied from a local (git-ignored) stack.env file in this same
# directory:  cp stack.env.example stack.env  and fill in the values.
# (For plain `docker compose` runs, pass the file explicitly:
#   docker compose --env-file stack.env up -d)
# No secret has a hardcoded default: the stack refuses to start if one is missing.
services:
  db:
    image: postgres:15-alpine
    container_name: eepy-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eepy_admin}
      # NOTE: this value must MATCH the password the existing postgres_data
      # volume was initialized with. Put the old value in stack.env until you
      # do a planned, backed-up data migration - the volume keeps its original
      # password even when you change stack.env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see deploy/stack.env.example}
      POSTGRES_DB: ${POSTGRES_DB:-eepy_host}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eepy-network

  backend:
    image: ghcr.io/kulik-labs-development/eepy-host-backend:latest
    container_name: eepy-backend
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required - see deploy/stack.env.example}
      # Long random string that signs JWTs (HS256). Rotating this invalidates
      # all existing login sessions (users just sign in again).
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required - see deploy/stack.env.example}
      # Fernet key (44-char url-safe Base64) for MCP credential encryption at rest.
      # MUST stay the same as the one that encrypted existing stored credentials,
      # otherwise they can no longer be decrypted.
      - MCP_ENCRYPTION_KEY=${MCP_ENCRYPTION_KEY:?MCP_ENCRYPTION_KEY is required - see deploy/stack.env.example}
      # Modular MCP sidecar runtime: "docker" runs integrations' MCP servers
      # (built from the integrations/ git submodules by CI) as sidecar
      # containers (needs the Docker socket below); "subprocess" spawns them
      # as local processes (local dev with the submodule checked out).
      # Default here is "docker".
      - EEPY_MCP_INSTANCE_BACKEND=${EEPY_MCP_INSTANCE_BACKEND:-docker}
      # How the backend reaches sidecar containers' host-bound (loopback-only)
      # ports. host.docker.internal resolves to the Docker host via the
      # host-gateway route (extra_hosts below) - required because the backend
      # is itself in a container here.
      - EEPY_MCP_DOCKER_HOST=host.docker.internal
      # Sidecar containment (third-party code holds the user's decrypted creds
      # in its env): CPU/memory caps on every sidecar container. Override to
      # match the host's budget.
      - EEPY_MCP_SIDECAR_MEM_LIMIT=${EEPY_MCP_SIDECAR_MEM_LIMIT:-512m}
      - EEPY_MCP_SIDECAR_CPU_LIMIT=${EEPY_MCP_SIDECAR_CPU_LIMIT:-1.0}
      # Optional: unique per-backend-process id for the sidecar orphan sweep.
      # Leave unset (default) and each process self-identifies with a uuid.
      # Only set it if your orchestrator already guarantees uniqueness.
      - EEPY_NODE_ID=${EEPY_NODE_ID:-}
    # host.docker.internal -> Docker host, so the backend can dial the
    # loopback-bound sidecar ports (EEPY_MCP_DOCKER_HOST above).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The Docker socket lets the backend spawn/kill per-user MCP sidecar
    # containers (e.g. ghcr.io/kulik-labs-development/eepy-host-happyfox,
    # built from integrations/happyfox-mcp by CI). This grants host-level
    # container control, so it is only mounted for the trusted backend
    # service (not the frontend, not db).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8068:8000"
    depends_on:
      - db
    networks:
      - eepy-network

  frontend:
    image: ghcr.io/kulik-labs-development/eepy-host-frontend:latest
    container_name: eepy-frontend
    restart: always
    environment:
      # NEXT_PUBLIC_* values are baked into the Next.js build at image-build
      # time, so this container env does not change the client URL. It is kept
      # for parity and documentation.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8068}
    ports:
      - "8067:3000"
    depends_on:
      - backend
    networks:
      - eepy-network

networks:
  eepy-network:
    driver: bridge

volumes:
  postgres_data:

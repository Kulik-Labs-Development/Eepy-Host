services:
  db:
    image: postgres:15-alpine
    container_name: eepy-db
    restart: always
    environment:
      POSTGRES_USER: eepy_admin
      POSTGRES_PASSWORD: [ROTATED_POSTGRES_PASSWORD]
      POSTGRES_DB: eepy_host
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eepy-network

  backend:
    image: ghcr.io/kulik-labs-development/eepy-host-backend:latest
    container_name: eepy-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://eepy_admin:[ROTATED_POSTGRES_PASSWORD]@db:5432/eepy_host
      - SECRET_KEY=[ROTATED_JWT_SECRET]
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - eepy-network

  frontend:
    image: ghcr.io/kulik-labs-development/eepy-host-frontend:latest
    container_name: eepy-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - eepy-network

networks:
  eepy-network:
    driver: bridge

volumes:
  postgres_data:
